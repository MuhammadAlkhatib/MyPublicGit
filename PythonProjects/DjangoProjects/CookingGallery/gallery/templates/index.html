<!DOCTYPE html>
<html lang="en">
<head>
    <r
    <meta charset="UTF-8">
    <title>Product Catalog</title>

    <style>



      body{
        position: relative;
      }

      .img{
        position:absolute;
        top: 0;
        right: 0;
        left: 0;
        bottom: 0;
  
         background-image: url('media/products/bg.jpg');
            opacity: 0.3;
            z-index: -1;
                 

      }
        /* Add CSS styles for flex container and items */
        .product-list {
            display: flex;
            flex-wrap: wrap; /* Allow items to wrap to the next row if necessary */
            justify-content: space-between; /* Space items evenly along the main axis */
            list-style: none; /* Remove list styles */
            padding: 0;
        }

        .product-item {
            flex: 1; /* Grow to fill available space evenly */
            max-width: 30%; /* Limit item width to avoid overcrowding */
            margin: 10px; /* Add spacing between items */
            border: 1px solid #ccc; /* Add a border for visual separation */
            padding: 10px;
            text-align: center;
        }
        /* body{

        } */

    </style>
</head>
<body  >
    <!-- <img src='media/products/bg.jpg' alt=""> -->
     <div class="img"> </div>
    <h1>وصفات الطعام</h1>
    
    <ul class="product-list">
        {% for product in products %}
            <li class="product-item">
                <a href="#">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" width="200">
                </a>
                <h2>{{ product.name }}</h2>
                <p>{{ product.description }}</p>
            </li>
        {% endfor %}
    
    </ul>
    
       
    
</body>
</html>
